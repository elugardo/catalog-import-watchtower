# PR checks. `tests` runs the one test command (CIW-06, `_docs/testing.md` ->
# The one command): backend unit, backend integration against the Compose
# `db` (including the OpenAPI 3.1 validation and the Alembic round trip of
# CIW-02), `check:api` and Vitest, all inside the `test` container. `compose-up`
# is spec section 9 scenario 6 (the stack starts with one command and reports
# the database reachable). `image` builds the runtime image; its Dockerfile
# `web` stage runs `npm run build` (tsc --noEmit + vite build), so the
# frontend production build runs here. CIW-10.1 adds gitleaks, the GHCR
# publish and the dev deploy. Nothing here needs a secret.

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (the one test command)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose -f compose.yaml -f compose.test.yaml run --rm --build test
        run: docker compose -f compose.yaml -f compose.test.yaml run --rm --build test
      - name: Database logs (on failure)
        if: failure()
        run: docker compose logs db
      - name: Stop the stack and drop its volume
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml down -v

  compose-up:
    name: Scenario 6 (docker compose up --wait, then /api/health)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up --build -d --wait
        run: docker compose up --build -d --wait --wait-timeout 600
      - name: GET /api/health is 200 with db ok
        run: |
          status=$(curl -sS -o health.json -w '%{http_code}' http://localhost:8000/api/health)
          echo "HTTP $status"; cat health.json; echo
          test "$status" = 200
          jq -e '.db == "okay"' health.json
      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs
      - name: Stop the stack and drop its volume
        if: always()
        run: docker compose down -v

  image:
    name: Image build (docker compose build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the app image with the commit SHA as version
        run: docker compose build app
        env:
          APP_VERSION: sha-${{ github.sha }}
      - name: Image reports the build-argument version and contains no .env
        run: |
          echo "placeholder=1" > .env
          docker compose run --rm --no-deps app ls -a /app | tee listing.txt
          if grep -q '^\.env' listing.txt; then echo "::error::.env leaked into the image"; exit 1; fi
          docker compose run --rm --no-deps app python -c "from app.settings import get_settings; v = get_settings().app_version; print(v); assert v == 'sha-${{ github.sha }}', v"
