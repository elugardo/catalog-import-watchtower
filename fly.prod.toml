# Fly.io config for the production app `ciw-prod` (CIW-10.2, ADR-0002).
# The same settings as fly.toml (dev) with only the app name changed.
# Deployed only by .github/workflows/promote-prod.yml, after Marcos approves
# the run in the GitHub `production` environment, with
#   flyctl deploy --config fly.prod.toml -a ciw-prod --image ghcr.io/elugardo/catalog-import-watchtower:sha-<SHA>
# so Fly never builds anything: there is no [build] section on purpose. The
# image is the exact one dev already ran; it is never rebuilt for production.
# No secret lives here. DATABASE_URL is a Fly secret on ciw-prod only, for
# the prod Neon project (`_docs/operations.md` -> Deployment -> Provisioning).

app = "ciw-prod"
primary_region = "ewr"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[deploy]
  # Authoritative migration step on Fly: runs once per deploy, in a temporary
  # machine, before any new app machine starts. A failing migration fails the
  # deploy and the previous release keeps serving. An image knows only the
  # Alembic revisions it was built with, so a rollback works only to a release
  # with the same Alembic head (then this is a no-op). Rolling back past a
  # migration fails here with "Can't locate revision" and the current release
  # keeps serving: fix forward (operations.md -> Rollback).
  release_command = "alembic upgrade head"
  strategy = "rolling"

[env]
  # Deployed environments never run the LLM agent; alerts show
  # "automated recovery disabled" (ADR-0002). Telemetry export is off on Fly.
  AGENT_ENABLED = "false"
  OTEL_SDK_DISABLED = "true"
  DATABASE_CONNECT_TIMEOUT_SECONDS = "5"

[processes]
  # Same command as the Dockerfile CMD (migrate, then serve).
  app = "sh -c 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000'"
  # Defined so the group exists, but ciw-prod runs ZERO worker machines, the
  # same as dev: with AGENT_ENABLED=false the worker would only idle. The
  # promotion workflow passes `--process-groups app` and then scales `worker`
  # to 0.
  worker = "python -m app.oncall"

[http_service]
  processes = ["app"]
  internal_port = 8000
  force_https = true
  # Stop when idle, wake on the next request (Marcos: stop when idle).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  processes = ["app", "worker"]
  size = "shared-cpu-1x"
  memory = "512mb"
