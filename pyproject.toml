[project]
name = "catalog-import-watchtower"
version = "0.0.0"
description = "Imports vendor product catalogs from CSV, validates every row, upserts in one transaction, and keeps an LLM on-call worker on the alerts."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
# The `alembic/` folder holds our migrations; the library of the same name is third-party.
known-third-party = ["alembic"]
